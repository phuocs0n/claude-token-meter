[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-token-meter"
version = "0.1.0"
description = "See which Claude models you used, how many tokens they took, and how many you will use at your current rate - from local Claude Code / Claude desktop logs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["claude", "claude-code", "anthropic", "tokens", "usage", "forecast"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/phuocs0n/claude-token-meter"
Issues = "https://github.com/phuocs0n/claude-token-meter/issues"

[project.scripts]
token-meter = "token_meter.cli:main"

[tool.setuptools]
packages = ["token_meter"]

[tool.setuptools.package-data]
token_meter = ["dashboard.html"]
