name: Release

# Push a tag like v0.2.0 to build the desktop app for Windows, macOS and Linux
# and publish it as a GitHub release. Run it by hand to only build (files are
# then kept as workflow artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Tk libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtk8.6
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: python -m pip install --upgrade pip pyinstaller
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build, self-test and package
        run: python packaging/build.py --package ${{ runner.os == 'Windows' && '--installer' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ runner.os }}
          path: dist/release/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          cat > notes.md <<'EOF'
          **Tải app / Download**

          | Máy / System | File |
          |---|---|
          | Windows 10/11 (x64) | `ClaudeTokenMeter-Setup-*.exe` (cài đặt / installer) hoặc / or `*-windows-x64-portable.zip` |
          | macOS (Apple Silicon) | `*-macos-arm64.zip` |
          | Linux (x64) | `*-linux-x64.tar.gz` |

          App chưa được ký số: Windows có thể hiện SmartScreen (bấm **More info → Run anyway**), macOS cần chuột phải → **Open** lần đầu.
          The app is not code-signed: on Windows choose **More info → Run anyway** in SmartScreen; on macOS right-click → **Open** the first time.
          EOF
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "Claude Token Meter $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
