<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Token Meter</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.05);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --other: #898781; --on-yellow: #0b0b0b;
  --meter-fill: #2a78d6; --meter-proj: #9ec5f4; --meter-track: #e7f0fc; --warn: #b26b00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --on-yellow: #ffffff;
    --meter-fill: #3987e5; --meter-proj: #1c5cab; --meter-track: #0d2a4f; --warn: #fab219;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --on-yellow: #ffffff;
  --meter-fill: #3987e5; --meter-proj: #1c5cab; --meter-track: #0d2a4f; --warn: #fab219;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 22px; margin: 0; font-weight: 650; }
h2 { font-size: 16px; margin: 28px 0 12px; font-weight: 650; }
h3 { font-size: 14px; margin: 0; font-weight: 600; }
.sub, .note { color: var(--ink2); margin: 4px 0 0; }
.note { font-size: 12.5px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.top-actions { display: flex; gap: 8px; }
button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { background: var(--wash); }
button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card + .card, .grid2 + .card, .card + .grid2 { margin-top: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.tiles > .card { margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 12px 0; }
.tile .label { color: var(--ink2); font-size: 12.5px; }
.tile .value { font-size: 22px; font-weight: 620; margin-top: 2px; }
.tile .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
.hero .value { font-size: 52px; font-weight: 650; line-height: 1.1; margin: 6px 0 4px; }
.hero .value small { font-size: 18px; font-weight: 500; color: var(--ink2); }
.hero .lines div { color: var(--ink2); margin-top: 2px; }
.filters { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: var(--page); padding: 10px 0; margin-top: 20px; border-bottom: 1px solid var(--border); }
.filters .sep { width: 1px; height: 24px; background: var(--border); margin: 0 6px; }
.filters .lab { color: var(--ink2); margin-right: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink2); font-size: 12.5px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.chart { width: 100%; }
.chart svg { display: block; overflow: visible; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .axis { stroke: var(--axis); stroke-width: 1; }
svg .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .rowlab { fill: var(--ink2); font-size: 12px; }
svg .hit { fill: transparent; outline: none; }
svg .hit:hover, svg .hit:focus { fill: var(--wash); }
svg .mark { pointer-events: none; }
.meter { position: relative; height: 12px; border-radius: 6px; background: var(--meter-track); overflow: hidden; margin: 12px 0 8px; }
.meter div { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.meter .proj { background: var(--meter-proj); }
.meter .used { background: var(--meter-fill); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
.kv dt { color: var(--ink2); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.warn { color: var(--warn); }
.seg { display: flex; gap: 2px; height: 28px; margin: 8px 0 12px; }
.seg div { border-radius: 4px; color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center;
  padding-left: 8px; overflow: hidden; white-space: nowrap; min-width: 0; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; color: var(--ink2); font-weight: 500; border-bottom: 1px solid var(--axis); padding: 6px 8px; white-space: nowrap; }
td { border-bottom: 1px solid var(--grid); padding: 6px 8px; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td .sw { margin-right: 6px; vertical-align: -1px; }
.sharebar { display: inline-block; height: 6px; border-radius: 3px; background: var(--ink2); opacity: .55; vertical-align: middle; margin-left: 8px; }
.hero .label { color: var(--ink2); font-size: 12.5px; }
details summary { cursor: pointer; color: var(--ink2); margin-top: 8px; font-size: 13px; }
.switches { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink2); }
.switches b { color: var(--ink); font-weight: 600; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); max-width: 300px; }
.tip .t { color: var(--ink2); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; }
.tip .r i { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.tip .r b { font-variant-numeric: tabular-nums; }
.tip .r span { color: var(--ink2); }
footer { margin-top: 28px; }
.empty { padding: 40px 0; color: var(--ink2); }
@media (max-width: 560px) { .hero .value { font-size: 40px; } .filters .sep { display: none; } }
</style>
</head>
<body>
<div class="wrap" id="app">

    <div>
      <h1>Claude Token Meter</h1>
      <p class="sub" id="subtitle"></p>
    </div>

  </div>
  <div class="tiles" id="nowTiles"></div>
  <div class="card">

    <div class="chart" id="fcChart"></div>

  <div class="filters" role="toolbar" id="filters"></div>

  <div class="tiles" id="rangeTiles"></div>

  <div class="card">

  <div class="card">

    <div class="table-wrap" id="modelTable"></div>

    </div>
    <div class="card">
      <div class="card-head"><h3 data-t="hours_title"></h3></div>
      <div class="chart" id="hourChart"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3 data-t="projects_title"></h3></div>
    <div class="table-wrap" id="projectTable"></div>
  </div>
  <div class="card">
    <div class="card-head"><h3 data-t="sessions_title"></h3></div>
    <div class="table-wrap" id="sessionTable"></div>
  </div>

  <footer>
    <p class="note" data-t="cost_note"></p>
    <p class="note" id="sourceNote"></p>
  </footer>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>

    source: "Nguồn: {roots} · {files} file · đã gộp {dups} dòng trùng · tạo lúc {t}",

    other: "Khác", no_data: "Không tìm thấy dữ liệu sử dụng.", no_range: "Không có dữ liệu trong khoảng này.",
    lang_btn: "English", theme_dark: "Giao diện tối", theme_light: "Giao diện sáng",
  },
  en: {

    now_title: "Now and forecast",

    alt_line: "At the 30-day rate: {a} · By trend: {b}",
    today: "Today", last24: "Last 24 hours", last1h: "Last hour",

    models_title: "By model",
    c_model: "Model", c_req: "Requests", c_total: "Total", c_cost: "Cost", c_share: "Share",
    c_first: "First used", c_last: "Last used", c_days: "Days", c_day: "Day",

};

let lang = store.get("tm-lang") || (D.meta && D.meta.lang) || "vi";
if (!I18N[lang]) lang = "vi";
let range = store.get("tm-range") || "30";
let metric = "tokens";

function T(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}

// ---------- formatting ----------
function fmt(n) {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (a >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(Math.round(n));
}
function fmtAxis(n) {
  const a = Math.abs(n);
  if (a >= 1e9) return +(n / 1e9).toFixed(1) + "B";
  if (a >= 1e6) return +(n / 1e6).toFixed(1) + "M";
  if (a >= 1e4) return +(n / 1e3).toFixed(0) + "K";
  return Math.round(n).toLocaleString("en-US");
}
function usd(x) { return "$" + x.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function usdAxis(x) { return "$" + (x >= 100 ? Math.round(x) : +x.toFixed(2)); }
function pct(x) { return (x * 100).toFixed(1) + "%"; }
function full(n) { return Math.round(n).toLocaleString(lang === "vi" ? "vi-VN" : "en-US"); }
function short(m) { return m.startsWith("claude-") ? m.slice(7) : m; }
function dayLabel(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return lang === "vi" ? `${String(d).padStart(2, "0")}/${String(m).padStart(2, "0")}`
                       : new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function dateTime(iso) {
  const d = new Date(iso);
  const p = (x) => String(x).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function hm(iso) { const d = new Date(iso); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function duration(min) { const h = Math.floor(min / 60), m = Math.round(min % 60); return `${h}h${String(m).padStart(2, "0")}m`; }

// ---------- DOM helpers (all data text goes through textContent) ----------
const NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function swatch(color) { const s = h("span", "sw"); s.style.background = color; return s; }
const $ = (id) => document.getElementById(id);

// ---------- tooltip ----------
const tip = $("tip");
function showTip(ev, content) {
  tip.textContent = "";
  tip.appendChild(h("div", "t", content.title));
  for (const r of content.rows) {
    const row = h("div", "r");
    const key = h("i"); key.style.background = r.color || "var(--ink2)";
    row.append(key, h("b", null, r.value), h("span", null, r.label));
    tip.appendChild(row);
  }
  tip.hidden = false;
  moveTip(ev);
}
function moveTip(ev) {
  let cx = ev.clientX, cy = ev.clientY;
  if (cx == null || (cx === 0 && cy === 0 && ev.target && ev.target.getBoundingClientRect)) {
    const b = ev.target.getBoundingClientRect(); cx = b.left + b.width / 2; cy = b.top + 8;
  }
  const pad = 14, r = tip.getBoundingClientRect();
  let x = cx + pad, y = cy + pad;
  if (x + r.width > innerWidth - 8) x = cx - r.width - pad;
  if (y + r.height > innerHeight - 8) y = cy - r.height - pad;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.max(8, y) + "px";
}
function hideTip() { tip.hidden = true; }
function bindTip(node, fn) {
  node.addEventListener("pointerenter", (e) => showTip(e, fn()));
  node.addEventListener("pointermove", moveTip);
  node.addEventListener("pointerleave", hideTip);
  node.addEventListener("focus", (e) => showTip(e, fn()));
  node.addEventListener("blur", hideTip);
}

// ---------- colors: follow the model, assigned once from all data ----------
let COLORS = {}, SERIES = [];
function assignColors() {
  const all = D.models.map((m) => m.model);
  const colored = all.length > 8 ? all.slice(0, 7) : all;
  const byFirst = D.models.filter((m) => colored.includes(m.model))
    .sort((a, b) => (a.first < b.first ? -1 : a.first > b.first ? 1 : 0));
  COLORS = {};
  byFirst.forEach((m, i) => { COLORS[m.model] = `var(--s${i + 1})`; });
  SERIES = byFirst.map((m) => ({ key: m.model, label: short(m.model), color: COLORS[m.model], models: [m.model] }));
  const rest = all.filter((m) => !COLORS[m]);
  rest.forEach((m) => { COLORS[m] = "var(--other)"; });
  if (rest.length) SERIES.push({ key: "__other", label: T("other"), color: "var(--other)", models: rest });
}

// ---------- aggregation ----------
function rangeIdx() {
  const n = D.days.length;
  if (range === "all") return [0, n - 1];
  return [Math.max(0, n - Number(range)), n - 1];
}
function dayValue(model, i, what) {
  const c = D.cells[model];
  if (what === "cost") return c.cost[i];
  return c.in[i] + c.out[i] + c.cw[i] + c.cr[i];
}
function sumModel(model, i0, i1) {
  const c = D.cells[model], o = { in: 0, out: 0, cw: 0, cr: 0, cost: 0, req: 0, days: 0 };
  for (let i = i0; i <= i1; i++) {
    for (const k of ["in", "out", "cw", "cr", "cost", "req"]) o[k] += c[k][i];
    if (c.req[i] > 0) o.days++;
  }
  o.total = o.in + o.out + o.cw + o.cr;
  return o;
}
function sumAll(i0, i1) {
  const o = { in: 0, out: 0, cw: 0, cr: 0, cost: 0, req: 0, total: 0, models: 0 };
  for (const m of D.models) {
    const s = sumModel(m.model, i0, i1);
    for (const k of ["in", "out", "cw", "cr", "cost", "req", "total"]) o[k] += s[k];
    if (s.req > 0) o.models++;
  }
  return o;
}
function sumSparse(days, i0, i1) {
  const o = { total: 0, cost: 0, req: 0 };
  for (const [i, t, c, q] of days) if (i >= i0 && i <= i1) { o.total += t; o.cost += c; o.req += q; }
  return o;
}

// ---------- charts ----------
function niceMax(v) {
  if (!(v > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}
function roundTop(x, y, w, hgt, r) {
  r = Math.max(0, Math.min(r, w / 2, hgt));
  return `M${x},${y + hgt}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hgt}Z`;
}

// stacks: array (one per x) of [{value, color}] bottom-first. opt: labels, fmtY, tooltip(i), fade(i), height
function barChart(host, stacks, opt) {
  host.textContent = "";
  const W = Math.max(host.clientWidth, 280), H = opt.height || 240;
  const m = { t: 8, r: 6, b: 24, l: 52 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const svg = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": opt.aria || "" }, host);
  const totals = stacks.map((s) => s.reduce((a, b) => a + b.value, 0));
  const ymax = niceMax(Math.max(0, ...totals));
  for (let k = 0; k <= 4; k++) {
    const y = m.t + ih - (ih * k) / 4;
    svgEl("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, class: k === 0 ? "axis" : "grid" }, svg);
    svgEl("text", { x: m.l - 8, y: y + 4, "text-anchor": "end", class: "tick" }, svg).textContent = opt.fmtY((ymax * k) / 4);
  }
  const n = stacks.length, band = iw / Math.max(n, 1), bw = Math.max(1, Math.min(24, band * 0.72));
  const step = Math.max(1, Math.ceil(64 / band));
  const hits = svgEl("g", {}, svg), marks = svgEl("g", { class: "mark" }, svg);
  stacks.forEach((stack, i) => {
    const x0 = m.l + band * i, x = x0 + (band - bw) / 2;
    const hit = svgEl("rect", { x: x0, y: m.t, width: band, height: ih, class: "hit", tabindex: 0 }, hits);
    bindTip(hit, () => opt.tooltip(i));
    let y = m.t + ih;
    const segs = stack.filter((s) => s.value > 0);
    segs.forEach((s, j) => {
      const full = (s.value / ymax) * ih, top = y - full;
      const hh = j > 0 && full > 2.5 ? full - 2 : full; // 2px surface gap between stacked parts
      const attrs = { style: `fill:${s.color}` };
      if (opt.fade && opt.fade(i)) attrs["fill-opacity"] = 0.35;
      if (j === segs.length - 1) svgEl("path", { ...attrs, d: roundTop(x, top, bw, hh, 4) }, marks);
      else svgEl("rect", { ...attrs, x, y: top, width: bw, height: hh }, marks);
      y = top;
    });
    if (i % step === 0) {
      svgEl("text", { x: x0 + band / 2, y: H - 6, "text-anchor": "middle", class: "tick" }, svg).textContent = opt.labels[i];
    }
  });
}

function legend(host, items) {
  host.textContent = "";
  for (const it of items) {
    const s = h("span");
    const sw = swatch(it.color);
    if (it.faded) sw.style.opacity = 0.35;
    s.append(sw, document.createTextNode(it.label));
    host.appendChild(s);
  }
}

function table(host, heads, rows, numFrom) {
  host.textContent = "";
  if (!rows.length) { host.appendChild(h("p", "note", T("no_range"))); return; }
  const tb = h("table"), thead = h("thead"), tr = h("tr");
  heads.forEach((c, i) => tr.appendChild(h("th", i >= numFrom ? "num" : "", c)));
  thead.appendChild(tr); tb.appendChild(thead);
  const body = h("tbody");
  for (const r of rows) {
    const row = h("tr");
    r.forEach((c, i) => {
      const td = h("td", i >= numFrom && !(c && c.noNum) ? "num" : "");
      if (c instanceof Node) td.appendChild(c);
      else if (c && c.node) { td.appendChild(c.node); if (c.cls) td.className += " " + c.cls; if (c.title) td.title = c.title; }
      else td.textContent = c;
      row.appendChild(td);
    });
    body.appendChild(row);
  }
  tb.appendChild(body); host.appendChild(tb);
}

    card.appendChild(h("p", "note", T("block_time", { s: hm(B.start), e: hm(B.end), left: duration(B.remaining_min) })));
    const scale = Math.max(B.projected_total, B.max_past_block || 0, B.total, 1);
    const meter = h("div", "meter");

    const used = h("div", "used"); used.style.width = (100 * B.total / scale) + "%";

    card.appendChild(meter);
    const dl = h("dl", "kv");
    const kv = (k, val, color) => {
      const dt = h("dt"); if (color) dt.appendChild(swatch(color)); dt.appendChild(document.createTextNode((color ? " " : "") + k));
      dl.append(dt, h("dd", null, val));
    };
    kv(T("block_used"), `${fmt(B.total)} · ${usd(B.cost)}`, "var(--meter-fill)");
    kv(T("block_proj"), `${fmt(B.projected_total)} · ${usd(B.projected_cost)}`, "var(--meter-proj)");
    kv(T("block_rate"), fmt(B.tokens_per_min) + T("per_min"));

function renderDaily() {
  const [i0, i1] = rangeIdx();
  $("dailyTitle").textContent = metric === "cost" ? T("daily_cost") : T("daily_tokens");
  const f = metric === "cost" ? usd : fmt;
  const stacks = [], labels = [], rowsT = [];
  for (let i = i0; i <= i1; i++) {
    const stack = SERIES.map((se) => ({
      key: se.key, color: se.color, label: se.label,
      value: se.models.reduce((a, m) => a + dayValue(m, i, metric), 0),
    }));
    stacks.push(stack); labels.push(dayLabel(D.days[i]));
    const total = stack.reduce((a, b) => a + b.value, 0);
    rowsT.push([D.days[i], ...stack.map((s) => (s.value ? f(s.value) : "")), f(total)]);
  }
  barChart($("dailyChart"), stacks, {
    labels, fmtY: metric === "cost" ? usdAxis : fmtAxis, aria: $("dailyTitle").textContent,
    tooltip: (k) => {
      const st = stacks[k], total = st.reduce((a, b) => a + b.value, 0);
      return { title: `${D.days[i0 + k]} · ${f(total)}`,

function renderHistory() {
  const [i0, i1] = rangeIdx(), host = $("historyChart");
  host.textContent = "";
  const rows = D.models.filter((m) => sumModel(m.model, i0, i1).req > 0)
    .sort((a, b) => (a.first < b.first ? -1 : 1));
  if (!rows.length) { host.appendChild(h("p", "note", T("no_range"))); return; }
  const W = Math.max(host.clientWidth, 280), labW = W < 500 ? 92 : 128, rowH = 22;
  const H = rows.length * rowH + 26, n = i1 - i0 + 1, band = (W - labW - 6) / n;
  const cw = band > 3 ? band - 1.5 : band;
  const svg = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": T("history_title") }, host);
  rows.forEach((m, r) => {
    const y = r * rowH + 4, color = COLORS[m.model];
    svgEl("rect", { x: 0, y: y + 3, width: 8, height: 8, rx: 2, style: `fill:${color}` }, svg);
    svgEl("text", { x: 14, y: y + 11, class: "rowlab" }, svg).textContent = short(m.model);
    svgEl("line", { x1: labW, x2: W - 6, y1: y + 7, y2: y + 7, class: "grid" }, svg);
    const c = D.cells[m.model];
    for (let i = i0; i <= i1; i++) {
      if (!c.req[i]) continue;
      const x = labW + (i - i0) * band;
      svgEl("rect", { x, y: y + 1, width: Math.max(cw, 1), height: 12, rx: cw >= 4 ? 2 : 0, style: `fill:${color}`, class: "mark" }, svg);
      const hit = svgEl("rect", { x: x - 2, y: y - 3, width: Math.max(band, 6) + 4, height: rowH, class: "hit", tabindex: 0 }, svg);
      const tot = dayValue(m.model, i, "tokens"), day = D.days[i];
      bindTip(hit, () => ({ title: `${short(m.model)} · ${day}`, rows: [
        { color, value: fmt(tot), label: T("tokens") },
        { value: full(c.req[i]), label: T("requests") },
        { value: usd(c.cost[i]), label: T("cost") }] }));
    }
  });
  const step = Math.max(1, Math.ceil(64 / band));
  for (let i = i0; i <= i1; i++) {
    if ((i - i0) % step) continue;
    svgEl("text", { x: labW + (i - i0) * band + band / 2, y: H - 6, "text-anchor": "middle", class: "tick" }, svg).textContent = dayLabel(D.days[i]);
  }
  const ul = $("switches"); ul.textContent = "";
  for (const s of D.switches) {
    if (s.date < D.days[i0] || s.date > D.days[i1]) continue;
    const li = h("li");

    if (s.previous) li.append(document.createTextNode(short(s.previous) + " → "));
    else li.append(document.createTextNode(T("started") + " "));
    li.append(h("b", null, short(s.model)));
    ul.appendChild(li);
  }
}

}

function pathCell(p) {
  const shown = p.length > 48 ? "…" + p.slice(-47) : p;
  return { node: document.createTextNode(shown), title: p, noNum: true };
}

function renderProjects() {
  const [i0, i1] = rangeIdx();
  const sessCount = {};
  for (const s of D.sessions) if (sumSparse(s.days, i0, i1).req) sessCount[s.project] = (sessCount[s.project] || 0) + 1;
  const list = D.projects.map((p) => ({ p, s: sumSparse(p.days, i0, i1) })).filter((x) => x.s.req)
    .sort((a, b) => b.s.total - a.s.total).slice(0, 15);
  table($("projectTable"), [T("c_project"), T("c_sessions"), T("c_req"), T("c_total"), T("c_cost")],
    list.map(({ p, s }) => [pathCell(p.name), String(sessCount[p.name] || 0), full(s.req), fmt(s.total), usd(s.cost)]), 1);
}

function renderSessions() {
  const [i0, i1] = rangeIdx();
  const list = D.sessions.map((x) => ({ x, s: sumSparse(x.days, i0, i1) })).filter((y) => y.s.req)
    .sort((a, b) => b.s.total - a.s.total).slice(0, 15);
  table($("sessionTable"), [T("c_session"), T("c_project"), T("c_start"), T("c_end"), T("c_models"), T("c_req"), T("c_total"), T("c_cost")],
    list.map(({ x, s }) => [x.id.slice(0, 8), pathCell(x.project || "?"), dateTime(x.first), dateTime(x.last),
      x.models.slice(0, 2).map(short).join(", "), full(s.req), fmt(s.total), usd(s.cost)]), 5);
}

// ---------- theme & language ----------
function isDark() {
  const t = document.documentElement.dataset.theme;
  if (t) return t === "dark";
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
const savedTheme = store.get("tm-theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$("themeBtn").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("tm-theme", next); renderHeader();
});
$("langBtn").addEventListener("click", () => {
  lang = lang === "vi" ? "en" : "vi"; store.set("tm-lang", lang); renderAll();
});

function renderAll() {
  if (!D.days || !D.days.length) {
    $("app").textContent = "";
    $("app").appendChild(h("p", "empty", T("no_data")));
    return;
  }
  assignColors();
  renderHeader();
  if (D.forecast) renderNow();
  renderFilters();
  renderRange();
}

let resizeTimer = null;
let lastW = innerWidth;
addEventListener("resize", () => {
  if (innerWidth === lastW) return;
  lastW = innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderAll, 150);
});

if (D.meta && D.meta.live) {
  setInterval(async () => {
    try {
      const r = await fetch("api/data", { cache: "no-store" });
      if (r.ok) { D = await r.json(); renderAll(); }
    } catch (e) { /* keep the last render */ }
  }, 60000);
}

renderAll();
})();
</script>
</body>
</html>
